<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype Đề 2: TrấnBiên Trực Tuyến – Phản Ánh Hiện Trường</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="presenter-bar">
    <div class="presenter-brand">
      <span class="presenter-badge">ĐỀ 02 • PROTOTYPE</span>
      <div>
        <div class="presenter-title">TrấnBiên Trực Tuyến – Phản Ánh Hiện Trường &amp; Điều Phối Đô Thị</div>
        <div class="presenter-sub">Wizard 3 bước tuần tự • Bàn giao Phường &ndash; Đơn vị thực thi • Gộp trùng 50m • Chế độ chữ lớn</div>
      </div>
    </div>

    <div class="role-switcher" id="top-role-bar">
      <button class="role-btn active" data-view="split" onclick="App.setView('split')">Song song (Dân + Phường)</button>
      <button class="role-btn" data-view="citizen" onclick="App.setView('citizen')">1. Người dân (Mobile)</button>
      <button class="role-btn" data-view="volunteer" onclick="App.setView('volunteer')">2. Đoàn viên xác minh</button>
      <button class="role-btn" data-view="officer" onclick="App.setView('officer')">3. Phường &amp; Đơn vị thực thi</button>
    </div>
  </header>

  <div class="scenario-bar">
    <strong style="color:#93c5fd;">Tình huống trình chiếu:</strong>
    <button class="scen-btn" onclick="App.runScenario('standard')">1. Gửi tuần tự 3 bước + Gộp trùng 50m</button>
    <button class="scen-btn" onclick="App.runScenario('override_ai')">2. Dân chọn khác gợi ý AI</button>
    <button class="scen-btn" onclick="App.runScenario('medium_ai')">3. Ảnh đêm &rarr; Đoàn viên xác minh</button>
    <button class="scen-btn" onclick="App.runScenario('senior')">4. Chế độ Người cao tuổi</button>
    <button class="scen-btn" onclick="App.runScenario('error_blur')">5. Lỗi: Ảnh rung nhòe</button>
    <button class="scen-btn" onclick="App.runScenario('error_gps')">6. Lỗi: Mất sóng GPS</button>
    <button class="scen-btn" onclick="App.runScenario('empty')">7. Trạng thái trống (KP.6)</button>
  </div>

  <main id="stage-root" class="stage"></main>
  <div id="toast-root"></div>

  <script src="./icons.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
