<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trang chủ – Bản đồ quanh tôi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1747D6}a:hover{color:#0B2A8C}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #C5D0EA;background:#fff;font:500 14px 'Be Vietnam Pro',sans-serif;color:#0A1A44;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip-on{background:#1747D6;color:#fff;border-color:#3FD0FF;box-shadow:0 0 8px rgba(63,208,255,.45)}
.pin{position:absolute;width:36px;height:36px;border-radius:18px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.road{position:absolute;background:#fff}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F0F4FF;font-family:'Be Vietnam Pro',sans-serif;color:#0A1A44;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <header style="padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#071A6B 0%,#1747D6 100%);color:#fff;border-bottom:2px solid #3FD0FF;box-shadow:0 2px 14px rgba(63,208,255,.35)">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:12px;border:1.5px solid #3FD0FF;color:#BFEFFF;background:rgba(63,208,255,.12)">PHƯỜNG TRẤN BIÊN</span>
      <span style="font-size:21px;font-weight:700">Phản ánh quanh tôi</span>
    </div>
    <a href="MH04-CaoTuoi.dc.html" aria-label="Bật chế độ chữ lớn" style="height:44px;padding:0 14px;border-radius:22px;border:1.5px solid #3FD0FF;background:rgba(255,255,255,.08);font-size:16px;font-weight:700;color:#fff;text-decoration:none;display:flex;align-items:center;gap:6px;box-shadow:0 0 12px rgba(63,208,255,.45)">Aa <span style="font-size:13px;font-weight:600">Chữ lớn</span></a>
  </header>
  <div style="display:flex;gap:8px;padding:10px 20px;background:#fff;border-bottom:1px solid #DCE4F5;overflow:hidden">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5"><button class="{{ c.cls }}" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for>
  </div>
  <div role="img" aria-label="Bản đồ các phản ánh trong bán kính 500m" style="position:relative;flex:1;background:#E3EBF8;overflow:hidden">
    <div style="position:absolute;left:-40px;top:300px;width:480px;height:46px;background:#CFE0EC;transform:rotate(-8deg)"></div>
    <div class="road" style="left:0;top:90px;width:390px;height:14px"></div>
    <div class="road" style="left:0;top:210px;width:390px;height:20px"></div>
    <div class="road" style="left:120px;top:0;width:16px;height:420px"></div>
    <div class="road" style="left:270px;top:0;width:12px;height:420px"></div>
    <span style="position:absolute;left:150px;top:190px;font-size:11px;font-weight:600;color:#47567A">Hưng Đạo Vương</span>
    <span style="position:absolute;left:8px;top:72px;font-size:11px;font-weight:600;color:#47567A">Phan Chu Trinh</span>
    <span style="position:absolute;left:200px;top:330px;font-size:11px;font-weight:600;color:#3A6A8A">Sông Đồng Nai</span>
    <div style="position:absolute;left:170px;top:140px;width:120px;height:120px;border-radius:60px;border:2px dashed #1747D6;background:rgba(23,71,214,.08)"></div>
    <div style="position:absolute;left:222px;top:192px;width:16px;height:16px;border-radius:8px;background:#1747D6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(23,71,214,.25)"></div>
    <div class="pin" style="left:150px;top:150px;background:#B42318" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 6v8M12 18v.5"/></svg></div>
    <div class="pin" style="left:252px;top:230px;background:#9A5B00" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></div>
    <div class="pin" style="left:60px;top:110px;background:#1C7445" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <div class="pin" style="left:300px;top:60px;background:#1C7445" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <div class="pin" style="left:84px;top:260px;background:#B42318" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 6v8M12 18v.5"/></svg></div>
    <div class="pin" style="left:320px;top:330px;background:#1C7445" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <div style="position:absolute;left:12px;bottom:12px;background:#fff;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.12)">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:6px;background:#B42318"></span>! Mới tiếp nhận</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:6px;background:#9A5B00"></span>◷ Đang xử lý</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:6px;background:#1C7445"></span>✓ Đã khắc phục</span>
    </div>
  </div>
  <section style="background:#fff;border-radius:20px 20px 0 0;margin-top:-16px;position:relative;padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.08)">
    <div style="width:40px;height:4px;border-radius:2px;background:#C5D0EA;align-self:center"></div>
    <div style="font-size:15px;font-weight:600">{{ summary }}</div>
    <div style="font-size:13px;color:#47567A">2 mới · 1 đang xử lý · 3 đã khắc phục</div>
    <div style="display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #DCE4F5;border-radius:14px">
      <div style="width:44px;height:44px;border-radius:12px;background:#FFF1D6;display:flex;align-items:center;justify-content:center" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A5B00" stroke-width="2" stroke-linecap="round"><path d="M4 20 9 4M20 20 15 4M12 6v2M12 11v2M12 16v2"/></svg></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15px;font-weight:600">Ổ gà mặt đường</span>
        <span style="font-size:13px;color:#47567A">Hưng Đạo Vương · cách 120m</span>
      </div>
      <span style="font-size:12px;font-weight:600;color:#7A4800;background:#FFF1D6;padding:4px 8px;border-radius:8px">Đang xử lý</span>
    </div>
    <a href="MH02-ChupAnh.dc.html" style="height:56px;border-radius:16px;background:linear-gradient(135deg,#1747D6,#2B7BFF);color:#fff;font-size:17px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid #3FD0FF;box-shadow:0 4px 18px rgba(63,208,255,.45)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>Gửi phản ánh</a>
  </section>
  <nav aria-label="Điều hướng chính" style="height:64px;background:#fff;border-top:1px solid #DCE4F5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">
    <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:#1747D6;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Bản đồ</a>
    <a href="MH05-TheoDoi.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:#47567A;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Của tôi</a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:#47567A;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Tài khoản</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { f: 'Tất cả' };
renderVals() {
  const f = (this.state && this.state.f) || 'Tất cả';
  const counts = { 'Tất cả': 6, 'Đèn đường': 1, 'Ổ gà': 2, 'Ngập': 1, 'Rác': 2 };
  const chips = Object.keys(counts).map((k) => ({
    label: k,
    cls: k === f ? 'chip chip-on' : 'chip',
    pressed: String(k === f),
    pick: () => this.setState({ f: k })
  }));
  const summary = f === 'Tất cả' ? 'Trong 500m quanh bạn: 6 phản ánh' : f + ' trong 500m: ' + counts[f] + ' phản ánh';
  return { chips, summary };
}
}
</script>
</body>
</html>
