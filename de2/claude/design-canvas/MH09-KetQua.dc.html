<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cập nhật kết quả xử lý</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1747D6}a:hover{color:#0B2A8C}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F0F4FF;font-family:'Be Vietnam Pro',sans-serif;color:#0A1A44;display:flex;flex-direction:column">
  <header style="padding:20px;background:#fff;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:13px;color:#47567A">Link nộp kết quả · không cần đăng nhập</span>
    <span style="font-size:18px;font-weight:700">PA-0452 · Đèn đường hỏng</span>
    <span style="font-size:13px;color:#47567A">Phan Chu Trinh · Giao: Điện lực · <b style="color:#9B1C12">Hạn còn 6 giờ</b></span>
  </header>
  <main style="flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:14px">
    <div role="img" aria-label="Khung chụp ảnh sau xử lý với ảnh trước mờ chồng lên để căn góc" style="position:relative;height:300px;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(135deg,#2A3C78 0 14px,#24356C 14px 28px)">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 10px,transparent 10px 20px)"></div>
      <div style="position:absolute;left:170px;top:40px;width:10px;height:220px;background:rgba(255,255,255,.45)"></div>
      <div style="position:absolute;left:150px;top:36px;width:60px;height:24px;border-radius:12px;background:rgba(255,255,255,.45)"></div>
      <span style="position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;background:rgba(6,21,69,.8);color:#fff;padding:4px 8px;border-radius:6px">Ảnh trước (mờ) – căn cho trùng góc</span>
      <div style="position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center">
        <button aria-label="Chụp ảnh sau xử lý" style="width:72px;height:72px;border-radius:36px;border:5px solid #fff;background:rgba(255,255,255,.3)"></button>
      </div>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">Ghi chú kết quả
      <textarea rows="3" style="border-radius:12px;border:1px solid #C5D0EA;padding:12px;font:400 15px 'Be Vietnam Pro',sans-serif;color:#0A1A44;resize:none">Đã thay bóng LED 100W, kiểm tra hoạt động lúc 18:00.</textarea>
    </label>
    <p style="margin:0;font-size:13px;color:#47567A;line-height:1.5">Khi bấm Hoàn thành: ghim trên bản đồ chuyển sang xanh và người gửi nhận tin mời đánh giá.</p>
  </main>
  <div style="padding:12px 20px 28px;background:#fff;border-top:1px solid #DCE4F5;display:grid;grid-template-columns:1fr 2fr;gap:10px">
    <button style="height:56px;border-radius:16px;border:1px solid #C5D0EA;background:#fff;color:#0A1A44;font:600 15px 'Be Vietnam Pro',sans-serif">Báo vướng mắc</button>
    <button style="height:56px;border-radius:16px;border:none;background:#1C7445;color:#fff;font:700 17px 'Be Vietnam Pro',sans-serif">Hoàn thành</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
