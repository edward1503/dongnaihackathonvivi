<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phản ánh Trấn Biên – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1747D6;--blue2:#2B7BFF;--navy:#0A1A44;--deep:#071A6B;--cyan:#3FD0FF;--bg:#F0F4FF;--muted:#47567A;--line:#DCE4F5;--line2:#C5D0EA;--soft:#E5EDFF;--red:#B42318;--redbg:#FDE8E6;--redtx:#9B1C12;--amb:#9A5B00;--ambbg:#FFF1D6;--ambtx:#7A4800;--grn:#1C7445;--grnbg:#E3F3E9;--grntx:#14532D}
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--navy);min-height:100vh;background:radial-gradient(circle at 15% 0%,#1747D6 0,#071A6B 45%,#040E3D 100%)}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:14px 16px 6px;color:#fff}
.ctl .brand{font-weight:800;letter-spacing:.04em;margin-right:8px;font-size:14px;padding:5px 12px;border:1.5px solid var(--cyan);border-radius:14px;box-shadow:0 0 12px rgba(63,208,255,.4)}
.rt{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid rgba(63,208,255,.5);background:rgba(255,255,255,.06);color:#DCE9FF;font-weight:600;font-size:14px}
.rt.on{background:var(--blue);border-color:var(--cyan);color:#fff;box-shadow:0 0 12px rgba(63,208,255,.55)}
.rt.warn{border-color:#FFB547;color:#FFD08A}.rt.warn.on{background:#7A4800;color:#fff;box-shadow:none}
.guide{max-width:900px;margin:4px auto 12px;padding:8px 14px;border-radius:12px;background:rgba(63,208,255,.12);border:1px solid rgba(63,208,255,.4);color:#E6F7FF;font-size:14px;text-align:center}
.stage{display:flex;justify-content:center;padding:0 12px 32px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 2px var(--cyan),0 0 30px rgba(63,208,255,.35),0 24px 60px rgba(0,0,0,.5)}
.phone.big .scr{zoom:1.12}
.desk{width:min(1280px,100%);height:820px;background:var(--bg);border-radius:20px;overflow:hidden;display:flex;box-shadow:0 0 0 2px var(--cyan),0 24px 60px rgba(0,0,0,.5)}
.scr{flex:1;overflow:auto;display:flex;flex-direction:column}
.scr>*{flex-shrink:0}
.hdr{padding:18px 20px 14px;background:linear-gradient(135deg,var(--deep),var(--blue));color:#fff;border-bottom:2px solid var(--cyan);box-shadow:0 2px 14px rgba(63,208,255,.35);display:flex;align-items:center;gap:12px}
.hdr.light{background:#fff;color:var(--navy);border-bottom:1px solid var(--line);box-shadow:none}
.badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:12px;border:1.5px solid var(--cyan);color:#BFEFFF;background:rgba(63,208,255,.12)}
.ib{width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.14);color:inherit;display:flex;align-items:center;justify-content:center;flex:none}
.hdr.light .ib{background:#ECF1FC}
.pill{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--cyan);background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 0 12px rgba(63,208,255,.45);margin-left:auto}
.chips{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
td:nth-child(2){min-width:190px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:#fff;font-weight:500;font-size:14px;color:var(--navy);white-space:nowrap}
.chip.on{background:var(--blue);color:#fff;border-color:var(--cyan);box-shadow:0 0 8px rgba(63,208,255,.45)}
.map{position:relative;background:#E3EBF8;overflow:hidden;flex:none}
.road{position:absolute;background:#fff}
.pinb{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:17px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);padding:0}
.pinb.sel{outline:3px solid var(--cyan);outline-offset:2px}
.sheet{background:#fff;border-radius:20px 20px 0 0;margin-top:-16px;position:relative;padding:14px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);align-self:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.st{font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;align-self:flex-start}
.st.new{background:var(--redbg);color:var(--redtx)}.st.assigned{background:var(--ambbg);color:var(--ambtx)}.st.done{background:var(--grnbg);color:var(--grntx)}.st.rejected{background:#ECF1FC;color:#34436A}.st.flag{background:var(--ambbg);color:var(--ambtx)}.st.ok{background:var(--grnbg);color:var(--grntx)}.st.info{background:var(--soft);color:#0B2A8C}
.cta{height:56px;border-radius:16px;border:1.5px solid var(--cyan);background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 4px 18px rgba(63,208,255,.4);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.cta:disabled{opacity:.45;box-shadow:none}
.sec{height:50px;border-radius:16px;border:1px solid var(--line2);background:#fff;color:var(--navy);font-size:15px;font-weight:600;width:100%}
.sec.dark{background:transparent;border:2px solid #fff;color:#fff}
.nav{height:64px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);flex:none}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.nav button.on{color:var(--blue);font-weight:700}
.dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.steps{display:flex;gap:6px}.steps span{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}.steps span.on{background:var(--cyan)}
.hdr.light .steps span{background:var(--line)}.hdr.light .steps span.on{background:var(--blue)}
.tile{height:100px;border-radius:16px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:var(--navy);position:relative}
.tile.on{border:3px solid var(--blue);background:var(--soft)}
.aitag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:#fff;background:var(--blue);padding:2px 6px;border-radius:6px}
.photo{background:repeating-linear-gradient(135deg,#2A3C78 0 14px,#24356C 14px 28px)}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:var(--navy);color:#fff;border:1.5px solid var(--cyan);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:50}
.desk .toast{left:auto;right:24px;bottom:24px;width:380px}
.notif{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--navy);color:#fff;border:1.5px solid var(--cyan);display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;text-align:left;width:calc(100% - 32px)}
.tl li{display:flex;gap:12px}
.tl .d{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tl .ln{width:3px;flex:1;min-height:20px;margin:4px 0}
.star{width:52px;height:52px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.tag{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line2);background:#fff;font-size:14px;color:var(--navy)}
.tag.on{background:var(--soft);border-color:var(--blue);color:#0B2A8C;font-weight:700}
.big1{border-radius:20px;border:3px solid #000;background:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;font-weight:800;font-size:23px;color:#000;text-align:left;width:100%}
.num{width:48px;height:48px;border-radius:24px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.side{width:240px;flex:none;background:linear-gradient(180deg,var(--deep),#0B2A8C);border-right:2px solid var(--cyan);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.side .it{height:42px;border-radius:10px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#C8D6FF}
.side .it.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.kpi{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:14px;padding:11px 12px;border-bottom:1px solid #EEF2FB;vertical-align:middle}
tr.pick{cursor:pointer}tr.pick:hover{background:#F6F9FF}tr.sel{background:#EAF1FF}
.btn{height:36px;border-radius:10px;padding:0 12px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:#fff;color:var(--navy)}
.btn.p{border:none;background:var(--blue);color:#fff}.btn.on{border:2px solid var(--blue);background:var(--soft);color:#0B2A8C}
.btn.g{border:1px solid #0F5C33;color:#0F5C33}.btn.r{border:1px solid #E7B4AE;color:var(--redtx)}
.ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.ico{width:96px;height:96px;border-radius:48px;display:flex;align-items:center;justify-content:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
textarea,select,input[type=search]{border-radius:12px;border:1px solid var(--line2);padding:10px 12px;font-size:15px;color:var(--navy);resize:none}
.spin{width:22px;height:22px;border-radius:11px;border:3px solid rgba(23,71,214,.25);border-top-color:var(--blue);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:520px){
  .ctl{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:8px 10px;scrollbar-width:none}
  .ctl .brand{display:none}
  .rt{height:34px;font-size:13px;flex:none;padding:0 12px}
  .guide{margin:0 10px 8px;font-size:12px;padding:6px 10px;text-align:left}
  .stage{padding:0}
  .phone{width:100%;height:calc(100dvh - 118px);border-radius:0;box-shadow:none}
  .phone.big .scr{zoom:1.08}
  .desk{border-radius:0;height:auto;min-height:calc(100dvh - 118px);box-shadow:none}
  .side{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .desk main{padding:14px!important}
  .desk .toast{left:12px;right:12px;width:auto;bottom:12px;position:fixed}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.split{display:flex;gap:18px;align-items:flex-start;justify-content:center;width:100%;max-width:1760px}
.split .desk{flex:1;min-width:0;width:auto;height:844px}
.scen{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:2px 16px 8px}
.scen .lb{font-size:13px;font-weight:700;color:#93C5FD}
.sb{height:34px;padding:0 13px;border-radius:17px;border:1px solid rgba(63,208,255,.4);background:rgba(255,255,255,.04);color:#DCEBFF;font-weight:600;font-size:13px}
.sb:hover,.sb:focus-visible{background:var(--blue);border-color:var(--cyan);outline:none}
.lmk{position:absolute;font-size:11px;font-weight:700;color:#0B2A8C;background:#fff;border:1px solid #C5D0EA;border-radius:8px;padding:2px 7px;white-space:nowrap}
@media (max-width:1100px){.split{flex-direction:column;align-items:center}.split .desk{width:100%;height:auto}}
@media (max-width:520px){.scen{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 10px 8px;scrollbar-width:none}.sb{flex:none}.scen .lb{display:none}.split .desk{display:none}}
body.embed{background:transparent;min-height:0}
body.embed .stage{padding:0;display:block}
body.embed .phone{width:390px;height:844px;border-radius:0;box-shadow:none}
body.embed .phone.big .scr{zoom:1.12}
body.embed .desk{width:1280px;height:820px;border-radius:0;box-shadow:none}
body.embed .desk .side{display:flex}
body.embed .desk .kpis{grid-template-columns:repeat(4,1fr)}
</style>

const ic=(n,c='currentColor',s=20,w=2)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const T={light:{label:'Đèn đường',short:'Đèn đường',dept:'Điện lực',c:'#9A5B00'},pothole:{label:'Ổ gà mặt đường',short:'Ổ gà',dept:'Tổ quản lý đô thị',c:'#1747D6'},flood:{label:'Ngập nước',short:'Ngập',dept:'Tổ quản lý đô thị',c:'#2B6CB0'},trash:{label:'Rác thải',short:'Rác',dept:'Công ty Môi trường đô thị',c:'#1C7445'}};
const DEPTS=['Tổ quản lý đô thị','Điện lực','Công ty Môi trường đô thị'];
const IMG={pothole:['assets/pothole_before.jpg','assets/pothole_after.jpg'],flood:['assets/flood_before.jpg','assets/flood_after.jpg'],light:['assets/streetlight_before.jpg','assets/streetlight_after.jpg'],trash:['assets/trash_before.jpg','assets/trash_after.jpg']};
const thumb=(type,size)=>`<img src="${IMG[type][0]}" alt="" style="width:${size}px;height:${size}px;border-radius:10px;object-fit:cover;flex:none">`;
const M_PER_PX=2.5, ME={x:158,y:148};
const pad=n=>String(n).padStart(2,'0');
const now=()=>{const d=new Date();return `24/11 · ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dist=(a,b)=>Math.round(Math.hypot(a.x-b.x,a.y-b.y)*M_PER_PX);

function seed(){return{
  role:(typeof innerWidth!=='undefined'&&innerWidth>=1200)?'split':'citizen',scr:'home',big:false,filter:'all',pin:null,draft:null,toast:null,notifs:[],
  stats:{total:64,done:47},offline:false,queue:[],
  staff:{sel:'PA-0461',hours:48,dept:null,filter:'all'},unit:{sel:null,shot:false},
  rate:{pos:52,stars:0,tags:{}},next:470,
  reports:[
    {id:'PA-0461',type:'pothole',addr:'43 Hưng Đạo Vương',note:'Gần cổng trường tiểu học',desc:'Ổ gà rộng, đọng nước trước cổng trường, xe máy phải lách sang làn ô tô.',x:150,y:150,status:'new',reporters:3,mine:false,created:'24/11 · 06:10'},
    {id:'PA-0463',type:'pothole',addr:'49 Hưng Đạo Vương',x:166,y:160,status:'new',reporters:1,mine:false,created:'24/11 · 07:02'},
    {id:'PA-0458',type:'flood',addr:'Cách Mạng Tháng Tám, gần chợ',x:84,y:262,status:'new',reporters:3,desc:'Nước ngập ngang mắt cá sau mưa, miệng cống bị rác chặn.',flag:'Người dân chọn khác AI (AI: Rác thải)',created:'23/11 · 17:40'},
    {id:'PA-0466',type:'light',addr:'Hẻm 30 Phan Chu Trinh',x:330,y:250,status:'new',reporters:1,desc:'Bác Tư nhờ báo: đèn đầu hẻm tắt ba tối liền.',flag:'Không có ảnh · người cao tuổi gửi',created:'24/11 · 05:55'},
    {id:'PA-0452',type:'light',addr:'Phan Chu Trinh',x:252,y:228,status:'assigned',dept:'Điện lực',hours:6,assignedAt:'22/11 · 09:00',reporters:2,created:'22/11 · 08:20',dueTxt:'Còn 6 giờ',dueBad:true},
    {id:'PA-0447',type:'trash',addr:'Hẻm 8 Nguyễn Ái Quốc',x:300,y:40,status:'assigned',dept:'Công ty Môi trường đô thị',hours:48,assignedAt:'21/11 · 10:00',reporters:1,created:'21/11 · 09:30',dueTxt:'Quá hạn 1 ngày',dueBad:true},

    {id:'PA-0430',type:'flood',addr:'Đường 30 Tháng 4',x:310,y:330,status:'done',dept:'Tổ quản lý đô thị',reporters:4,created:'20/11 · 16:00',doneAt:'22/11 · 15:00'},
    {id:'PA-0425',type:'light',addr:'Nguyễn Văn Trị',x:40,y:330,status:'done',dept:'Điện lực',reporters:1,created:'19/11 · 19:10',doneAt:'21/11 · 18:00'}
  ]}}
let S=seed();
const R=id=>S.reports.find(r=>r.id===id);
const open=r=>r.status==='new'||r.status==='assigned';
const stTxt=r=>r.status==='new'?'Mới tiếp nhận':r.status==='assigned'?('Đang xử lý · '+(r.dept||'')):r.status==='done'?'✓ Đã khắc phục':r.status==='rejected'?'Đã đóng':'';

let toastTimer;

function notify(r,text){if(r.mine)S.notifs.push({rid:r.id,text})}

function guide(){
  const r=R('PA-0461');
  if(!r.mine&&r.status==='new')return 'Bước 1 · <b>Người dân</b>: bấm “Gửi phản ánh” → Chụp ảnh → Đúng vị trí → <b>+1 Đồng tình</b>';
  if(r.status==='new')return 'Bước 2 · <b>Cán bộ phường</b>: chọn PA-0461 → <b>Gộp</b> phản ánh trùng → chọn hạn → <b>Giao việc</b>';
  if(r.status==='assigned')return 'Bước 3 · <b>Đơn vị xử lý</b>: mở PA-0461 → Chụp ảnh sau → <b>Hoàn thành</b>';
  if(r.status==='done'&&!r.rating)return 'Bước 4 · <b>Người dân</b>: bấm thông báo → kéo Trước/Sau → chấm sao';
  return `Xong kịch bản! Phường đã xử lý <b>${S.stats.done}/${S.stats.total}</b>. Thử thêm: Đoàn viên xác minh, Chế độ chữ lớn, Mất mạng, ảnh mờ. Bấm “Đặt lại” để demo lại.`;
}

  const roles=[['split','Song song Dân + Phường'],['citizen','Người dân'],['volunteer','Đoàn viên'],['staff','Cán bộ phường'],['unit','Đơn vị xử lý']];

  <div class="scen"><span class="lb">Mở nhanh tình huống:</span>${scens.map(([k,l])=>`<button class="sb" data-a="scen" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="guide">${guide()}</div><div class="stage">`;

  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function timeline(r){
  const s=[{t:'Đã tiếp nhận',d:r.created+(r.assisted?' · đoàn viên gửi hộ':''),ok:true}];
  if(r.flag)s.push({t:r.status==='rejected'&&!r.verified?'Đoàn viên xác minh: không đúng thực tế':r.verified?'Đoàn viên đã xác minh':'Chờ đoàn viên xác minh',d:r.verified?r.verifiedAt:r.flag,ok:!!r.verified||r.status==='rejected'});
  if(r.status==='rejected'){s.push({t:'Đã đóng',d:r.reason,ok:true,end:true});return s}
  s.push({t:r.dept?'Đã giao: '+r.dept:'Chờ giao bộ phận xử lý',d:r.dept?(r.assignedAt+' · Hạn xử lý '+r.hours+' giờ'):'Thường trong 1 ngày làm việc',ok:!!r.dept});
  s.push({t:'Đang xử lý',d:r.status==='assigned'?(r.dueTxt||('Còn '+r.hours+' giờ đến hạn')):'',ok:r.status==='done'});
  s.push({t:'Hoàn thành',d:r.status==='done'?r.doneAt:'Bạn sẽ nhận tin qua Zalo/SMS',ok:r.status==='done'});
  let cur=false;s.forEach(x=>{if(!x.ok&&!cur){x.cur=true;cur=true}});return s;
}

  ${r.status==='done'?(r.rating?`<div class="card"><b>Bạn đã đánh giá ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</b><span class="muted">Cảm ơn bạn đã góp ý cho phường.</span></div>`:`<button class="cta" data-a="rate" data-v="${r.id}">Xem ảnh trước/sau &amp; đánh giá</button>`):''}
  ${!r.flag?`<p class="muted" style="margin:0">Bước “Đoàn viên xác minh” chỉ xuất hiện khi phản ánh cần kiểm tra thêm.</p>`:''}</div></div>`;
}

function unitView(){
  const u=S.unit,list=S.reports.filter(r=>r.status==='assigned');
  if(!u.sel||!R(u.sel)||R(u.sel).status!=='assigned')return `<div class="scr"><header class="hdr" style="flex-direction:column;align-items:flex-start;gap:6px"><span class="badge">LINK NỘP KẾT QUẢ · KHÔNG CẦN ĐĂNG NHẬP</span><span style="font-size:20px;font-weight:700">Việc được giao (${list.length})</span></header>
  <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">${list.length?list.map(r=>`<button class="card" style="text-align:left;cursor:pointer" data-a="usel" data-v="${r.id}"><div class="row" style="justify-content:space-between"><b>${r.id} · ${T[r.type].label}</b><span class="st" style="background:${r.dueBad?'#B42318':'var(--soft)'};color:${r.dueBad?'#fff':'#0B2A8C'}">${r.dueTxt||'Còn '+r.hours+' giờ'}</span></div><span class="muted">${r.addr} · Giao: ${r.dept}</span></button>`).join(''):`<div class="card muted">Chưa có việc nào được giao.</div>`}</div></div>`;
  const r=R(u.sel);
  return `<div class="scr"><header class="hdr"><button class="ib" data-a="uback" aria-label="Quay lại">${ic('back','#fff',20,2.4)}</button><div style="display:flex;flex-direction:column"><span style="font-size:13px;color:#BFEFFF">${r.addr} · Giao: ${r.dept}</span><span style="font-size:18px;font-weight:700">${r.id} · ${T[r.type].label}</span></div></header>
  <div style="padding:16px 20px;display:flex;flex-direction:column;gap:14px;flex:1">
  <div style="position:relative;height:300px;border-radius:18px;overflow:hidden;${u.shot?'background:repeating-linear-gradient(135deg,#BFD8C7 0 14px,#B3CFBC 14px 28px)':''}" class="${u.shot?'':'photo'}">
   <img src="${IMG[r.type][u.shot?1:0]}" alt="${u.shot?'Ảnh sau xử lý':'Ảnh trước, hiện mờ để căn góc'}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:${u.shot?1:.45}">
   ${u.shot?`<span style="position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;background:#1C7445;color:#fff;padding:4px 8px;border-radius:6px">Ảnh sau xử lý ✓</span>`
   :`<div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 10px,transparent 10px 20px)"></div><span style="position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;background:rgba(6,21,69,.8);color:#fff;padding:4px 8px;border-radius:6px">Ảnh trước (mờ) – căn cho trùng góc</span><div style="position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center"><button data-a="ushoot" aria-label="Chụp ảnh sau xử lý" style="width:72px;height:72px;border-radius:36px;border:5px solid #fff;background:rgba(255,255,255,.3)"></button></div>`}
  </div>
  <label class="f">Ghi chú kết quả<textarea rows="3" data-in="result">${r.type==='pothole'?'Đã vá ổ gà bằng bê tông nhựa, cắm biển cảnh báo trong 24 giờ.':'Đã khắc phục xong.'}</textarea></label>
  <p class="muted" style="margin:0;line-height:1.5">Khi bấm Hoàn thành: ghim trên bản đồ chuyển xanh và người gửi nhận tin mời đánh giá.</p></div>
  <div style="padding:12px 20px 26px;background:#fff;border-top:1px solid var(--line)"><button class="cta" style="background:linear-gradient(135deg,#1C7445,#23955A)" data-a="udone" ${u.shot?'':'disabled'}>Hoàn thành</button></div></div>`;
}

/* ---------------- ACTIONS ---------------- */
function createReport(q){const id='PA-0'+(S.next++);const r=Object.assign({id,status:'new',reporters:1,mine:true,created:q.time},q);delete r.time;S.reports.push(r);S.stats.total++;return r}
const A={
  scen:v=>{const lay=S.role==='split'?'split':'citizen';S=seed();S.role=lay;preset(v);if(v==='queued')S.offline=true},
  clearArea:()=>{S.emptyArea=false},
  role:v=>{S.role=v;if((v==='citizen'||v==='split')&&(S.notifs.length||!['home','mine','detail','rate'].includes(S.scr)))S.scr='home'},
  reset:()=>{S=seed();toast('Đã đặt lại dữ liệu demo')},
  offline:()=>{S.offline=!S.offline;if(!S.offline&&S.queue.length){const n=S.queue.length;S.queue.forEach(createReport);S.queue=[];toast(`Có mạng trở lại – đã tự gửi ${n} phản ánh đang chờ`)}},
  big:()=>{S.big=!S.big},
  filter:v=>{S.filter=v;S.pin=null},
  pin:v=>{S.pin=S.pin===v?null:v},
  go:v=>{S.scr=v},
  start:()=>{S.draft={photo:false,assisted:S.draft&&S.draft.assisted};S.scr='capture'},
  shoot:()=>{const d=S.draft;d.photo=true;d.time=now();d.analyzing=true;d.ai='pothole';d.desc='Ổ gà đọng nước giữa làn xe máy, dễ gây té ngã.';setTimeout(()=>{if(S.draft===d){d.analyzing=false;render()}},1300)},
  shootblur:()=>{S.draft.time=now();S.scr='blur'},
  retake:()=>{S.draft={photo:false,assisted:S.draft.assisted};S.scr='capture'},
  manual:()=>{Object.assign(S.draft,{photo:true,ai:null,desc:''});S.scr='loc'},
  locok:()=>{S.draft.locOk=true},
  place:v=>{S.draft.place=v;S.draft.locOk=true;S.scr='loc'},
  dupskip:()=>{S.draft.dupSkip=true;S.scr='type'},
  plus1:v=>{const r=R(v);r.reporters++;r.mine=true;S.draft=null;S.sel=v;S.scr='detail';toast(`Đã +1 vào ${v}. Phường sẽ ưu tiên xử lý hơn.`)},
  type:v=>{S.draft.type=v},
  send:()=>{const d=S.draft;const q={type:d.type,addr:d.place||'45 Hưng Đạo Vương',x:ME.x,y:ME.y,desc:d.desc,time:d.time||now(),assisted:d.assisted};
    if(!d.ai)q.flag='Ảnh mờ, AI chưa nhận diện được';else if(d.type!==d.ai)q.flag=`Người dân chọn khác AI (AI: ${T[d.ai].label})`;
    S.draft=null;if(S.offline){S.queue.push(q);S.scr='queued';return}
    const r=createReport(q);S.sel=r.id;S.scr='detail';toast(`Đã gửi ${r.id}. Bạn sẽ nhận tin khi có cập nhật.`)},
  open:v=>{S.sel=v;S.notifs=S.notifs.filter(n=>n.rid!==v);S.scr='detail'},
  notif:()=>{const n=S.notifs.pop();S.sel=n.rid;S.scr='detail'},
  rate:v=>{S.sel=v;S.rate={pos:52,stars:0,tags:{}};S.scr='rate'},
  star:v=>{S.rate.stars=+v},
  tag:v=>{S.rate.tags[v]=!S.rate.tags[v]},
  sendrate:()=>{const r=R(S.sel);r.rating=S.rate.stars;S.scr='detail';toast('Cảm ơn bạn đã đánh giá!')},
  reopen:()=>{const r=R(S.sel);r.status='new';r.dept=null;r.reporters=r.reporters;S.stats.done--;S.scr='detail';toast('Đã mở lại phản ánh – phường sẽ xem xét lại.')},
  helpme:()=>{toast('Đã gửi yêu cầu. Đoàn viên KP5 sẽ gọi lại cho bác trong hôm nay.')},
  vok:v=>{const r=R(v);r.verified=true;r.verifiedAt=now()+' · đoàn viên KP5';r.vnote='Đoàn viên KP5 xác minh tại chỗ lúc '+now().split(' · ')[1]+': đúng thực tế.';notify(r,`${v} đã được đoàn viên xác minh`);toast(`Đã xác nhận ${v} – chuyển lên danh sách ưu tiên của phường`)},
  vfix:v=>{const r=R(v);r.verified=true;r.verifiedAt=now()+' · đoàn viên chụp lại ảnh';toast(`Đã cập nhật ảnh mới cho ${v}`)},
  vno:v=>{const r=R(v);r.status='rejected';r.reason='Đoàn viên xác minh tại chỗ: không đúng thực tế';notify(r,`${v} đã đóng sau khi xác minh`);toast(`${v}: không đúng thực tế – đã báo người gửi kèm lý do`)},
  assist:()=>{S.role='citizen';S.big=false;S.draft={photo:false,assisted:true};S.scr='capture'},
  sfilter:v=>{S.staff.filter=v},
  ssel:v=>{S.staff.sel=v;S.staff.dept=null;S.staff.hours=48},
  hours:v=>{S.staff.hours=+v},
  merge:v=>{const d=R(v),r=R(S.staff.sel);r.reporters+=d.reporters;d.status='merged';d.mergedInto=r.id;toast(`Đã gộp ${v} vào ${r.id} – nay ${r.reporters} người cùng báo`)},
  tovol:v=>{R(v).vol=true;toast(`Đã chuyển ${v} cho đoàn viên KP5 xác minh`)},
  assign:v=>{const r=R(v),st=S.staff;r.status='assigned';r.dept=st.dept||T[r.type].dept;r.hours=st.hours;r.assignedAt=now();r.dueTxt=null;r.dueBad=false;notify(r,`${v} đã giao cho ${r.dept} – hạn ${r.hours} giờ`);toast(`Đã giao ${v} cho ${r.dept}, hạn ${r.hours} giờ. Người gửi đã nhận thông báo.`)},
  remind:v=>{toast(`Đã nhắc ${R(v).dept} về ${v}`)},
  needmore:v=>{notify(R(v),`${v}: phường cần bạn bổ sung ảnh rõ hơn`);toast(`Đã gửi yêu cầu bổ sung cho người báo ${v}`)},
  reject:v=>{const r=R(v);r.status='rejected';r.reason='Không thuộc thẩm quyền phường – đã chuyển Sở Xây dựng';notify(r,`${v} đã chuyển cấp khác`);toast(`${v}: đã chuyển cấp khác, báo lý do cho người gửi`)},
  usel:v=>{S.unit={sel:v,shot:false}},
  uback:()=>{S.unit={sel:null,shot:false}},
  ushoot:()=>{S.unit.shot=true},
  udone:()=>{const r=R(S.unit.sel);r.status='done';r.doneAt=now();r.result=S.unit.result||(r.type==='pothole'?'Đã vá ổ gà bằng bê tông nhựa, cắm biển cảnh báo trong 24 giờ.':'Đã khắc phục xong.');S.stats.done++;notify(r,`${r.id} đã khắc phục xong – mời bạn đánh giá`);S.unit={sel:null,shot:false};toast(`Đã hoàn thành ${r.id}. Phường: ${S.stats.done}/${S.stats.total} đã xử lý.`)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){f(t.dataset.v);render()}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='pos'){S.rate.pos=+v;['bf'].forEach(()=>{document.getElementById('bf').style.width=v+'%';document.getElementById('bl').style.left=v+'%';document.getElementById('bh').style.left=v+'%'})}
  else if(k==='desc'&&S.draft)S.draft.desc=v;
  else if(k==='result')S.unit.result=v;
  else if(k==='dept')S.staff.dept=v;});
/* Embed mode for slides: index.html?embed=1&p=<preset> shows only the screen */
const QS=new URLSearchParams(location.search);
const EMBED=QS.get('embed')==='1';
function preset(p){
  const D='Ổ gà đọng nước giữa làn xe máy, dễ gây té ngã.',r=R('PA-0461');
  const mineAssigned=()=>Object.assign(r,{mine:true,reporters:5,status:'assigned',dept:'Tổ quản lý đô thị',hours:48,assignedAt:'24/11 · 09:30'});
  switch(p){
    case 'capture':S.draft={photo:true,time:'24/11 · 08:12',analyzing:false,ai:'pothole',desc:D};S.scr='capture';break;
    case 'dup':S.draft={photo:true,time:'24/11 · 08:12',ai:'pothole',desc:D,locOk:true};S.scr='loc';break;
    case 'type':S.draft={photo:true,time:'24/11 · 08:12',ai:'pothole',desc:D,locOk:true,dupSkip:true,type:'pothole'};S.scr='type';break;
    case 'typediff':S.draft={photo:true,time:'24/11 · 08:12',ai:'pothole',desc:D,locOk:true,dupSkip:true,type:'flood'};S.scr='type';break;
    case 'detail':mineAssigned();S.sel='PA-0461';S.scr='detail';break;
    case 'rate':mineAssigned();Object.assign(r,{status:'done',doneAt:'25/11 · 16:20',result:'Đã vá ổ gà bằng bê tông nhựa, cắm biển cảnh báo trong 24 giờ.'});S.sel='PA-0461';S.rate={pos:46,stars:5,tags:{'Xử lý nhanh':true,'Sạch sẽ':true}};S.scr='rate';break;
    case 'notif':mineAssigned();Object.assign(r,{status:'done',doneAt:'25/11 · 16:20'});S.notifs=[{rid:'PA-0461',text:'PA-0461 đã khắc phục xong – mời bạn đánh giá'}];break;
    case 'elder':S.big=true;break;
    case 'blur':S.draft={time:'24/11 · 08:12'};S.scr='blur';break;
    case 'pick':S.draft={photo:true,ai:'pothole',desc:D};S.scr='pick';break;
    case 'queued':S.queue=[{type:'pothole',addr:'45 Hưng Đạo Vương',x:ME.x,y:ME.y,desc:D,time:'24/11 · 08:12'}];S.scr='queued';break;
    case 'empty':S.emptyArea=true;break;
    case 'volunteer':S.role='volunteer';break;
    case 'unit':mineAssigned();S.role='unit';S.unit={sel:'PA-0461',shot:false};break;
    case 'staff':S.role='staff';break;
  }
}
if(EMBED){document.body.classList.add('embed');preset(QS.get('p')||'home')}
render();
</script>
</body>
