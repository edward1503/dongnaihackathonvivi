<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900"><g id="frame"><rect x="0" y="0" width="1440" height="900" fill="#ffffff"/><g id="col-1"><text x="64" y="85" font-family="Be Vietnam Pro" font-size="34" font-weight="700" fill="#0f172a" xml:space="preserve">Chuyển động: dẫn mắt và báo trạng thái, không trang trí</text><text x="64" y="116" font-family="Be Vietnam Pro" font-size="16" font-weight="400" fill="#475569" xml:space="preserve">Mỗi chuyển động trả lời một câu: cái gì vừa xuất hiện, cái gì đang chạy, cần nhìn vào đâu.</text></g><g id="row-6"><g id="card-1"><rect x="64" y="142" width="872" height="307" rx="16" fill="#ffffff"/><rect x="64.5" y="142.5" width="871" height="306" rx="15.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><g id="tr-1"><rect x="65" y="143" width="870" height="40" fill="#f1f5f9"/><rect x="65" y="182" width="870" height="1" fill="#e2e8f0"/><text x="81" y="166.5" font-family="Be Vietnam Pro" font-size="12" font-weight="700" fill="#475569" xml:space="preserve">Thông số</text><text x="263" y="166.5" font-family="Be Vietnam Pro" font-size="12" font-weight="700" fill="#475569" xml:space="preserve">Giá trị</text><text x="451" y="166.5" font-family="Be Vietnam Pro" font-size="12" font-weight="700" fill="#475569" xml:space="preserve">Dùng cho</text><text x="779" y="166.5" font-family="Be Vietnam Pro" font-size="12" font-weight="700" fill="#475569" xml:space="preserve">Độ dài tương đối</text></g><g id="tr-2"><rect x="65" y="234" width="870" height="1" fill="#e2e8f0"/><text x="81" y="213.5" font-family="Be Vietnam Pro" font-size="14" font-weight="600" fill="#0f172a" xml:space="preserve">Nhanh</text><text x="263" y="213.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">150 ms</text><text x="451" y="213.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">Phản hồi khi chạm vào nút, thẻ</text><g id="bar-track-1"><rect x="779" y="202.5" width="140" height="12" rx="6" fill="#f1f5f9"/><rect x="779" y="202.5" width="30.8" height="12" rx="6" fill="#1d4ed8"/></g></g><g id="tr-3"><rect x="65" y="286" width="870" height="1" fill="#e2e8f0"/><text x="81" y="265.5" font-family="Be Vietnam Pro" font-size="14" font-weight="600" fill="#0f172a" xml:space="preserve">Chuẩn</text><text x="263" y="265.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">300 ms</text><text x="451" y="265.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">Nội dung xuất hiện, chuyển màn</text><g id="bar-track-2"><rect x="779" y="254.5" width="140" height="12" rx="6" fill="#f1f5f9"/><rect x="779" y="254.5" width="61.59" height="12" rx="6" fill="#1d4ed8"/></g></g><g id="tr-4"><rect x="65" y="338" width="870" height="1" fill="#e2e8f0"/><text x="81" y="317.5" font-family="Be Vietnam Pro" font-size="14" font-weight="600" fill="#0f172a" xml:space="preserve">Chậm</text><text x="263" y="317.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">520 ms</text><text x="451" y="317.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">Thẻ cảnh báo trượt xuống, bảng trượt lên</text><g id="bar-track-3"><rect x="779" y="306.5" width="140" height="12" rx="6" fill="#f1f5f9"/><rect x="779" y="306.5" width="106.39" height="12" rx="6" fill="#1d4ed8"/></g></g><g id="tr-5"><rect x="65" y="390" width="870" height="1" fill="#e2e8f0"/><text x="81" y="369.5" font-family="Be Vietnam Pro" font-size="14" font-weight="600" fill="#0f172a" xml:space="preserve">Trễ giữa các khối</text><text x="263" y="369.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">55 ms</text><text x="451" y="369.5" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">Các khối hiện lần lượt từ trên xuống</text><g id="bar-track-4"><rect x="779" y="358.5" width="140" height="12" rx="6" fill="#f1f5f9"/><rect x="779" y="358.5" width="11.19" height="12" rx="5.59" fill="#94a3b8"/></g></g><g id="tr-6"><text x="81" y="424" font-family="Be Vietnam Pro" font-size="14" font-weight="600" fill="#0f172a" xml:space="preserve">Đường cong</text><text x="263" y="424" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">cubic-bezier(.2, 0, 0, 1)</text><text x="451" y="414" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">Vào nhanh, dừng êm. Dùng chung cho mọi</text><text x="451" y="434" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#0f172a" xml:space="preserve">chuyển động</text></g></g><g id="card-2"><rect x="956" y="142" width="420" height="307" rx="16" fill="#dbeafe"/><rect x="956.5" y="142.5" width="419" height="306" rx="15.5" fill="none" stroke="#93c5fd" stroke-width="1"/><g id="row-1"><g id="ic-2"><g id="ic-1" transform="translate(973 159) scale(0.8333 0.8333)"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="1001" y="174" font-family="Be Vietnam Pro" font-size="14" font-weight="700" fill="#1e3a8a" xml:space="preserve">Chế độ chữ lớn cho người cao tuổi</text></g><g id="row-2"><rect x="973" y="189" width="105.77" height="28" rx="14" fill="#ffffff"/><text x="983" y="207" font-family="Be Vietnam Pro" font-size="12" font-weight="600" fill="#0f172a" xml:space="preserve">Chuẩn 420 ms</text><rect x="1086.77" y="189" width="102.28" height="28" rx="14" fill="#ffffff"/><text x="1096.77" y="207" font-family="Be Vietnam Pro" font-size="12" font-weight="600" fill="#0f172a" xml:space="preserve">Chậm 680 ms</text><rect x="1197.05" y="189" width="78.97" height="28" rx="14" fill="#ffffff"/><text x="1207.05" y="207" font-family="Be Vietnam Pro" font-size="12" font-weight="600" fill="#0f172a" xml:space="preserve">Trễ 90 ms</text></g><g id="row-3"><rect x="973" y="233" width="8" height="8" rx="4" fill="#1d4ed8"/><text x="989" y="239" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#0f172a" xml:space="preserve">Chậm hơn khoảng 40%, không nảy, không lắc</text></g><g id="row-4"><rect x="973" y="259" width="8" height="8" rx="4" fill="#1d4ed8"/><text x="989" y="265" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#0f172a" xml:space="preserve">Nhịp cảnh báo chạy tối đa 3 lần rồi đứng yên, không nhấp nháy</text></g><g id="row-5"><rect x="973" y="285" width="8" height="8" rx="4" fill="#1d4ed8"/><text x="989" y="291" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#0f172a" xml:space="preserve">Tôn trọng cài đặt giảm chuyển động của máy: khi bật, mọi</text><text x="989" y="307" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#0f172a" xml:space="preserve">chuyển động tắt</text></g></g></g><text x="64" y="481" font-family="Be Vietnam Pro" font-size="12" font-weight="700" letter-spacing="0.6" fill="#475569" xml:space="preserve">KHOẢNH KHẮC CHÍNH</text><g id="grid-3-1"><g id="card-3"><rect x="64" y="505" width="426.66" height="114" rx="16" fill="#ffffff"/><rect x="64.5" y="505.5" width="425.66" height="113" rx="15.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><g id="row-7"><g id="icon-box-1"><rect x="81" y="522" width="40" height="40" rx="12" fill="#fee2e2"/><g id="ic-4"><g id="ic-3" transform="translate(91 532) scale(0.8333 0.8333)"><path d="M6.6 3h3l1.5 4.5-2 1.5a12 12 0 0 0 5.9 5.9l1.5-2 4.5 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.2 2 2 0 0 1 6.6 3z" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 3l-6 6" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 4v5h5" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g id="col-2"><text x="129" y="536" font-family="Be Vietnam Pro" font-size="12" font-weight="700" letter-spacing="0.5" fill="#1d4ed8" xml:space="preserve">A03 · Đổ chuông</text><text x="129" y="555" font-family="Be Vietnam Pro" font-size="14" font-weight="700" fill="#0f172a" xml:space="preserve">Thẻ cảnh báo trượt xuống</text></g></g><text x="81" y="582" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#475569" xml:space="preserve">Thẻ trượt từ mép trên trong 520 ms. Sóng lan đều quanh ảnh người</text><text x="81" y="598" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#475569" xml:space="preserve">gọi để báo máy đang đổ chuông.</text></g><g id="card-4"><rect x="506.66" y="505" width="426.67" height="114" rx="16" fill="#ede9fe"/><rect x="507.16" y="505.5" width="425.67" height="113" rx="15.5" fill="none" stroke="#c4b5fd" stroke-width="1"/><g id="row-8"><g id="icon-box-2"><rect x="523.66" y="522" width="40" height="40" rx="12" fill="#ffffff"/><g id="ic-6"><g id="ic-5" transform="translate(533.66 532) scale(0.8333 0.8333)"><path d="M11 4l1.8 5.2L18 11l-5.2 1.8L11 18l-1.8-5.2L4 11l5.2-1.8L11 4z" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 3v4" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 5h4" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 17v3" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 18.5h3" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g id="col-3"><text x="571.66" y="536" font-family="Be Vietnam Pro" font-size="12" font-weight="700" letter-spacing="0.5" fill="#7c3aed" xml:space="preserve">A04 · A05 · AI phân tích</text><text x="571.66" y="555" font-family="Be Vietnam Pro" font-size="14" font-weight="700" fill="#0f172a" xml:space="preserve">Tô đỏ lần lượt từng dấu hiệu</text></g></g><text x="523.66" y="582" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#4c1d95" xml:space="preserve">Mỗi cụm đáng ngờ được tô cách nhau 420 ms, theo đúng thứ tự</text><text x="523.66" y="598" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#4c1d95" xml:space="preserve">đọc, để người xem kịp nhìn từng cụm.</text></g><g id="card-5"><rect x="949.33" y="505" width="426.66" height="114" rx="16" fill="#dcfce7"/><rect x="949.83" y="505.5" width="425.66" height="113" rx="15.5" fill="none" stroke="#86efac" stroke-width="1"/><g id="row-9"><g id="icon-box-3"><rect x="966.33" y="522" width="40" height="40" rx="12" fill="#ffffff"/><g id="ic-8"><g id="ic-7" transform="translate(976.33 532) scale(0.8333 0.8333)"><circle cx="9" cy="8" r="3.5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 21c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 14.8c2.4.8 4 2.9 4 6.2" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g id="col-4"><text x="1014.33" y="536" font-family="Be Vietnam Pro" font-size="12" font-weight="700" letter-spacing="0.5" fill="#15803d" xml:space="preserve">A08 · Hỏi người thân</text><text x="1014.33" y="555" font-family="Be Vietnam Pro" font-size="14" font-weight="700" fill="#0f172a" xml:space="preserve">Lời con phóng to dần</text></g></g><text x="966.33" y="582" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#14532d" xml:space="preserve">Trong lúc chờ, chấm “đang chờ trả lời” nhấp nháy chậm. Khi con</text><text x="966.33" y="598" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#14532d" xml:space="preserve">trả lời, câu trả lời lớn dần lên.</text></g><g id="card-6"><rect x="64" y="635" width="426.66" height="114" rx="16" fill="#fee2e2"/><rect x="64.5" y="635.5" width="425.66" height="113" rx="15.5" fill="none" stroke="#fca5a5" stroke-width="1"/><g id="row-10"><g id="icon-box-4"><rect x="81" y="652" width="40" height="40" rx="12" fill="#dc2626"/><g id="ic-10"><g id="ic-9" transform="translate(91 662) scale(0.8333 0.8333)"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 10V4.5a1.5 1.5 0 0 1 3 0V11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 10V6a1.5 1.5 0 0 1 3 0v8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11.5L6.5 10A1.6 1.6 0 0 0 4 12l3.5 6A6 6 0 0 0 12.6 21H13a6 6 0 0 0 6-6v-4.5a1.5 1.5 0 0 0-2-1.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g id="col-5"><text x="129" y="666" font-family="Be Vietnam Pro" font-size="12" font-weight="700" letter-spacing="0.5" fill="#dc2626" xml:space="preserve">A10 · Dừng lại</text><text x="129" y="685" font-family="Be Vietnam Pro" font-size="14" font-weight="700" fill="#0f172a" xml:space="preserve">Nền nhịp chậm 3 lần</text></g></g><text x="81" y="712" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#7f1d1d" xml:space="preserve">Chữ “DỪNG LẠI” đập vào màn hình, nền đỏ đậm nhạt 3 nhịp rồi</text><text x="81" y="728" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#7f1d1d" xml:space="preserve">đứng yên để bà đọc nội dung.</text></g><g id="card-7"><rect x="506.66" y="635" width="426.67" height="114" rx="16" fill="#fef3c7"/><rect x="507.16" y="635.5" width="425.67" height="113" rx="15.5" fill="none" stroke="#fcd34d" stroke-width="1"/><g id="row-11"><g id="icon-box-5"><rect x="523.66" y="652" width="40" height="40" rx="12" fill="#ffffff"/><g id="ic-12"><g id="ic-11" transform="translate(533.66 662) scale(0.8333 0.8333)"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 7h7" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11h5" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g id="col-6"><text x="571.66" y="666" font-family="Be Vietnam Pro" font-size="12" font-weight="700" letter-spacing="0.5" fill="#b45309" xml:space="preserve">A11 · Truyện tranh</text><text x="571.66" y="685" font-family="Be Vietnam Pro" font-size="14" font-weight="700" fill="#0f172a" xml:space="preserve">Từng khung bật ra theo thứ tự</text></g></g><text x="523.66" y="712" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#78350f" xml:space="preserve">Bốn khung tranh hiện cách nhau 300 ms theo thứ tự đọc, dẫn mắt</text><text x="523.66" y="728" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#78350f" xml:space="preserve">từ khung 1 đến khung 4.</text></g><g id="card-8"><rect x="949.33" y="635" width="426.66" height="114" rx="16" fill="#ffffff"/><rect x="949.83" y="635.5" width="425.66" height="113" rx="15.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><g id="row-12"><g id="icon-box-6"><rect x="966.33" y="652" width="40" height="40" rx="12" fill="#dbeafe"/><g id="ic-14"><g id="ic-13" transform="translate(976.33 662) scale(0.8333 0.8333)"><path d="M4 20V4" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20h16" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 16v-5" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16V8" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 16v-3" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g id="col-7"><text x="1014.33" y="666" font-family="Be Vietnam Pro" font-size="12" font-weight="700" letter-spacing="0.5" fill="#1d4ed8" xml:space="preserve">W01 · Thống kê</text><text x="1014.33" y="685" font-family="Be Vietnam Pro" font-size="14" font-weight="700" fill="#0f172a" xml:space="preserve">Số đếm lên, biểu đồ vẽ dần</text></g></g><text x="966.33" y="712" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#475569" xml:space="preserve">Con số đếm từ 0, thanh ngang dài dần, đường biểu đồ được vẽ từ</text><text x="966.33" y="728" font-family="Be Vietnam Pro" font-size="12" font-weight="500" fill="#475569" xml:space="preserve">trái sang phải trong khoảng 1 giây.</text></g></g><g id="card-9"><rect x="64" y="769" width="1312" height="54" rx="16" fill="#f1f5f9"/><rect x="64.5" y="769.5" width="1311" height="53" rx="15.5" fill="none" stroke="#f1f5f9" stroke-width="1"/><g id="ic-16"><g id="ic-15" transform="translate(81 786) scale(0.8333 0.8333)"><path d="M8 5l11 7-11 7V5z" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g id="t-label-1"><text x="113" y="801" font-family="Be Vietnam Pro" font-size="14" font-weight="600" fill="#0f172a" xml:space="preserve">Bản có chuyển động:</text><text x="261.94" y="801" font-family="Be Vietnam Pro" font-size="14" font-weight="500" fill="#0f172a" xml:space="preserve">prototype/index.html. Trong Figma dùng Smart Animate với cùng thông số.</text></g></g></g></svg>