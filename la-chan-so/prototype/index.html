  let box=null;
  if(video){ box=document.createElement('div'); box.className='clip'; fr.src='video-call.html'; box.appendChild(fr); shell.appendChild(box); }
  else { fr.src='../screens/'+fileOf(name)+'.html?frame='+encodeURIComponent(name)+(mode==='flow'?'&flow=1':'')+(askOn?'':'&ask=0')+(v?'&v='+encodeURIComponent(v):''); shell.appendChild(fr); }
  inn.appendChild(shell); el.appendChild(inn); stage.appendChild(el);
  const dev={name,kind,el,inn,shell,view:fr,box,video,shown:false,v};
  size(dev, kind==='web'?1440:360, kind==='web'?900:800);
  if(video) fr.addEventListener('load',()=>setTimeout(()=>reveal(dev),250),{once:true});
  return dev;
}
function fallback(dev){
  if(dev.shown||dev!==pending) return;
  if(dev.video){ reveal(dev); return; }
  const img=new Image(); img.onclick=()=>{ if(mode!=='free') go(1); };
  img.onload=()=>{ if(dev!==pending) return; dev.view.replaceWith(img); dev.view=img; size(dev,img.naturalWidth/2,img.naturalHeight/2); reveal(dev); };
  img.onerror=()=>reveal(dev); img.src='../export/png/'+dev.name+'.png';
}
function reveal(dev){
  if(dev.shown||dev!==pending) return;
  dev.shown=true; pending=null; clearTimeout(dev.to);
  const old=cur; cur=dev;
  const sameDevice=old&&old.who===dev.who&&old.kind===dev.kind; const dir=dev.dir||1;
  if(old){ const out=sameDevice?[{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-36*dir)+'px)'}]:[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.97)'}];
    old.inn.animate(out,{duration:DUR*0.85,easing:EASE,fill:'forwards'}).onfinish=()=>old.el.remove(); }
  const inn=sameDevice?[{opacity:0,transform:'translateX('+(36*dir)+'px)'},{opacity:1,transform:'none'}]:[{opacity:0,transform:'scale(1.03)'},{opacity:1,transform:'none'}];
  dev.inn.animate(inn,{duration:DUR,easing:EASE,fill:'forwards',delay:old?DUR*0.25:0});
  $('scrollhint').className='scrollhint'+(dev.kind==='phone'&&!dev.video&&dev.view.tagName==='IFRAME'&&dev.h>PHONE_MAX_H?' on':'');
  dev.since=performance.now();
  speak(dev.name,dev.say);
  if(mode==='free'&&dev.name==='A11e-truyen-co-loi-ke') setStoryAuto(dev,true);
}
function open(name,who,dir,v,say){
  stopVoice();
  clearInterval(cur?.storyTimer);
  if(cur?.video) cur.view.remove();
  if(pending){ clearTimeout(pending.to); pending.el.remove(); pending=null; }
  const dev=build(name,v); dev.say=say; dev.dir=dir||1; dev.who=who; pending=dev;
  dev.to=setTimeout(()=>fallback(dev),2500);
  return dev;
}
// ---------- Giọng đọc (giọng có sẵn của trình duyệt) ----------
let viVoice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); viVoice=vs.find(x=>/^vi/i.test(x.lang))||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
const player=new Audio(); let queue=[];
player.addEventListener('ended',()=>playNext());
function playNext(){ const c=queue.shift(); if(!c) return; player.src='audio/'+c+'.m4a'; player.play().catch(()=>{ if(player.paused) queue=[]; }); }
function stopVoice(){ queue=[]; player.pause(); if('speechSynthesis' in window) speechSynthesis.cancel(); }
function speak(name,say){
  stopVoice();
  if(!voiceOn) return;
  if(name==='A04a-hoi-nhanh'&&!askOn) return;
  const clips=say||CLIPS[name];
  if(clips&&clips.length){ queue=clips.slice(); playNext(); return; }
  if(!('speechSynthesis' in window)||!SPEAK[name]||!viVoice) return;
  const u=new SpeechSynthesisUtterance(SPEAK[name]); u.voice=viVoice; u.lang=viVoice.lang; u.rate=0.95; speechSynthesis.speak(u);
}
function readyToAdvance(){
  return cur&&!pending&&performance.now()-cur.since>=5000&&player.paused&&!queue.length&&!window.speechSynthesis?.speaking;
}
function setStoryAuto(dev,on){
  clearInterval(dev.storyTimer);
  if(on) dev.storyTimer=setInterval(()=>{
    if(cur!==dev||!readyToAdvance()) return;
    if(mode==='flow') go(1); else nav('A11c-doc-tung-khung');
  },250);
}
function toast(t){ if(!t) return; const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2600); }

// ---------- Chế độ dùng thử tự do ----------
function resolve(to){ const P=PERSONAS[persona]; if(to==='@home') return P.home; if(to==='@learn') return P.learn; return to; }
function nav(to,opt){ opt=opt||{};
  to=resolve(to); if(!to) return;
  if(to==='@back'){ back(); return; }
  if(to!=='@video'&&!fileOf(to)) return;
  if(cur&&opt.push!==false) hist.push({name:cur.name,v:cur.v,persona});
  const p=to==='@video'?'vy':PERSONA_OF(to); if(p) setPersona(p,false);
  open(to,PERSONAS[persona].who[0],opt.dir||1,opt.v,opt.say);
  freeInfo(to);
}
function back(){ const h=hist.pop(); if(!h){ stopVoice(); toast('Bạn đang ở đầu lịch sử'); return; } persona=h.persona; renderPersonas(); open(h.name,PERSONAS[persona].who[0],-1,h.v); freeInfo(h.name); }
function freeInfo(name){
  const P=PERSONAS[persona];
  $('who').className='who '+P.who[0]; $('who').textContent=P.who[1];
  $('step').textContent='Dùng thử tự do';
  $('cap').textContent=name==='@video'?'Thử thách cuối bài: gọi video khuyên chị Lan':((FR[name]&&FR[name].name)||name);
  const guided=FLOWS.flat().find(x=>x[0]===name);
  $('note').textContent=name==='@video'?'Avatar AI nói bằng giọng thật và khép miệng theo lời. Bấm “Bắt đầu cuộc gọi”, rồi “Giữ để nói” để trả lời. Xong cuộc gọi sẽ có bảng điểm.':(guided?guided[3]:'');
  const tip=name==='@video'?'Muốn bỏ qua cuộc gọi: bấm “Về trang chủ” hoặc chọn màn khác.':(window.LCS_HINTS||{})[name]||'';
  $('tip').hidden=!tip; $('tip').textContent=tip;
  $('code').textContent=name==='@video'?'Trang video-call.html':'Màn '+name;
  $('info').animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:REDUCE?1:220,easing:EASE});
}
function setPersona(p,go){ persona=p; renderPersonas(); if(go){ hist=[]; nav(PERSONAS[p].home,{push:false}); } }
function renderPersonas(){
  $('personas').innerHTML=Object.entries(PERSONAS).map(([k,P])=>'<button data-p="'+k+'" class="'+(k===persona?'on':'')+'">'+P.label+'</button>').join('');
  const sims=SIMS[persona]||[]; $('simGrp').hidden=!sims.length;
  $('sims').innerHTML=sims.map(s=>'<button class="sim" data-to="'+s[1]+'">'+s[0]+'</button>').join('');
}
$('personas').onclick=e=>{ const b=e.target.closest('[data-p]'); if(b) setPersona(b.dataset.p,true); };
$('sims').onclick=e=>{ const b=e.target.closest('[data-to]'); if(b) nav(b.dataset.to); };
$('errs').innerHTML=ERRS.map(s=>'<button data-to="'+s[1]+'">'+s[0]+'</button>').join('');
$('errs').onclick=e=>{ const b=e.target.closest('[data-to]'); if(b) nav(b.dataset.to); };
$('back').onclick=back; $('homeBtn').onclick=()=>nav('@home');

// ---------- Chế độ xem theo luồng ----------
function show(dir,say){
  const s=FLOWS[f][i]; open(s[0],s[1][0],dir,null,say);
  const whoChanged=lastWho!==s[1][0]; lastWho=s[1][0];
  $('who').className='who '+s[1][0]; $('who').textContent=s[1][1];
  $('step').textContent='Bước '+(i+1)+'/'+FLOWS[f].length;
  $('cap').textContent=s[2]; $('note').textContent=s[3]; $('code').textContent='Màn '+s[0]; $('tip').hidden=true;
  $('scrollhint').className='scrollhint';
  $('dots').innerHTML=FLOWS[f].map((_,k)=>'<i class="'+(k<=i?'on':'')+'"></i>').join('');
  $('next').textContent=i===FLOWS[f].length-1?'Xem lại từ đầu':'Tiếp';
  $('info').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:REDUCE?1:240,easing:EASE});
  if(whoChanged) $('who').animate([{transform:'scale(.86)'},{transform:'scale(1.06)'},{transform:'none'}],{duration:REDUCE?1:360,easing:EASE});
}
const go=d=>{ i=(i+d+FLOWS[f].length)%FLOWS[f].length; show(d); };
function setMode(m,flow){
  mode=m; $('mFree').className=m==='free'?'on':''; $('t0').className=m==='flow'&&flow===0?'on':''; $('t1').className=m==='flow'&&flow===1?'on':'';
  $('freeCtl').hidden=m!=='free'; $('flowCtl').hidden=m==='free'; $('auto').hidden=m==='free';
  if(timer&&m==='free'){ clearInterval(timer); timer=null; $('auto').className='hbtn'; $('auto').textContent='Tự chạy'; }
  if(m==='free'){ hist=[]; setPersona(persona,true); } else { f=flow; i=0; lastWho=null; show(1); }
}
$('mFree').onclick=()=>setMode('free'); $('t0').onclick=()=>setMode('flow',0); $('t1').onclick=()=>setMode('flow',1);
$('tWeb').onclick=()=>{ setMode('free'); setPersona('khoa',true); }; $('tZalo').onclick=()=>{ setMode('free'); setPersona('minh',true); };
$('next').onclick=()=>go(1); $('prev').onclick=()=>go(-1);
$('auto').onclick=()=>{ if(timer){ clearInterval(timer); timer=null; $('auto').className='hbtn'; $('auto').textContent='Tự chạy'; }
  else { timer=setInterval(()=>{
    if(!readyToAdvance()) return;
    const state=cur.video&&cur.view.contentWindow?.__call?.state;
    if(!state||['idle','ended','done'].includes(state)) go(1);
  },250); $('auto').className='hbtn on'; $('auto').textContent='Dừng tự chạy'; } };
$('voice').onclick=()=>{ voiceOn=!voiceOn; $('voice').className='hbtn'+(voiceOn?' on':''); $('voice').textContent=(voiceOn?'🔊':'🔇')+' Giọng Bé Nai: '+(voiceOn?'bật':'tắt'); if(!voiceOn) stopVoice(); };

// ---------- Tin nhắn từ màn trong khung ----------
addEventListener('message',e=>{
  const m=e.data; if(!m||!m.lcs) return;
  if(m.lcs==='ready'){
    if(pending&&e.source===pending.view.contentWindow){ size(pending,m.w,m.h); reveal(pending); }
    else if(!pending&&cur?.video&&e.source===cur.view.contentWindow&&m.name==='A11i-bang-diem-cuoi-bai'){
      if(mode==='free') nav(m.name); else go(1);
    }   // trang gọi video chuyển sang bảng điểm
  }
  else if(m.lcs==='go'){ if(pending||!cur||e.source!==cur.view.contentWindow) return;
    if(typeof m.story==='boolean'){ setStoryAuto(cur,m.story); return; }
    if(m.ask){ askOn=!askOn; e.source.postMessage({lcs:'ask',on:askOn},location.origin); return; }
    if(m.speak){
      if(!voiceOn) toast('Giọng Bé Nai đang tắt');
      else if(cur.name==='A04a-hoi-nhanh'&&!askOn) toast('Hỏi bằng giọng nói đang tắt');
      else if(!cur.say&&!CLIPS[cur.name]&&!(SPEAK[cur.name]&&viVoice)) toast('Bản mẫu: chưa có giọng đọc cho màn này');
      else speak(cur.name,cur.say);
      return;
    }
    toast(m.toast);
    if(m.to){
      if(mode==='free') nav(m.to,{v:m.v,say:m.say});
      else if(m.to==='@back') go(-1);
      else {
        const P=PERSONAS[f===1?'vy':'hoa'];
        const target=m.to==='@home'?P.home:m.to==='@learn'?P.learn:m.to;
        const k=FLOWS[f].findIndex(x=>x[0]===target);
        if(k>=0){ i=k; show(1,m.say); } else go(1);
      }
    } else if(m.say){ if(voiceOn) speak(cur.name,m.say); else toast('Giọng Bé Nai đang tắt'); }
  }
  else if(m.lcs==='next'){ if(mode!=='free'&&cur&&e.source===cur.view.contentWindow) go(1); }
  else if(!pending&&cur&&e.source===cur.view.contentWindow){
    if(m.lcs==='key') key(m.key);
    if(m.lcs==='call-start'&&cur.video) stopVoice();
  }
});
function key(k){ if(mode==='free'){ if(k==='ArrowLeft') back(); return; } if(k==='ArrowRight'||k===' ') go(1); else if(k==='ArrowLeft') go(-1); }
addEventListener('keydown',e=>{
  if(e.defaultPrevented||!['ArrowLeft','ArrowRight',' '].includes(e.key)||e.key===' '&&e.target.closest('button')) return;
  e.preventDefault(); key(e.key);
});
addEventListener('resize',()=>{ if(cur) fit(cur); if(pending) fit(pending); });
const start=new URLSearchParams(location.search);
if(['0','1'].includes(start.get('flow'))){
  setMode('flow',Number(start.get('flow')));
  if(start.get('auto')==='1') $('auto').click();
} else {
  if(Object.hasOwn(PERSONAS,start.get('p'))) persona=start.get('p');
  setMode('free');
}
</script>
